<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ekart PRN & ZIP Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }

    .container {
      display: grid;
      grid-template-columns: 320px auto;
      gap: 28px;
      align-items: start;
      max-width: 860px;
      width: 100%;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .form-panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
    }

    .form-panel h2 {
      font-size: 14px;
      font-weight: 700;
      color: #58a6ff;
      margin-bottom: 12px;
    }

    .field {
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #8b949e;
      margin-bottom: 2px;
    }

    input {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #ffffff;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }

    input:focus {
      border-color: #58a6ff;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-zip {
      background-color: #f59e0b;
      color: #ffffff;
    }

    .btn-prn {
      background-color: #1f6feb;
      color: #ffffff;
    }

    .preview-stage {
      background: #21262d;
      padding: 24px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
    }

    .label-canvas {
      width: 310px;
      height: 460px;
      background: #ffffff;
      color: #000000;
      border-radius: 4px;
      padding: 12px 14px 10px 14px;
      position: relative;
      font-family: Arial, Helvetica, sans-serif;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      user-select: none;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 16px;
      margin-bottom: 8px;
    }

    .brand-text {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: -0.1px;
    }

    .status-tags {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .status-prepaid {
      font-size: 8.5px;
      font-weight: 700;
    }

    .status-priority {
      background: #000000;
      color: #ffffff;
      padding: 1.5px 3px;
      font-weight: 900;
      font-size: 8px;
    }

    .left-barcode-container {
      position: absolute;
      top: 34px;
      left: 10px;
      width: 50px;
      height: 270px;
    }

    .rotator {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotate(-90deg) translate(-270px, 0);
      transform-origin: top left;
      display: flex;
      align-items: center;
      height: 50px;
      width: 270px;
    }

    .rot-labels-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 270px;
      padding-left: 6px;
      font-family: Arial, sans-serif;
      font-weight: 700;
      font-size: 8px;
      line-height: 1;
      white-space: nowrap;
    }

    .lower-left-section {
      position: absolute;
      top: 315px;
      left: 10px;
      width: 70px;
    }

    .batch-1 {
      font-size: 10px;
      font-weight: 800;
      font-family: Arial, sans-serif;
      line-height: 1.1;
    }

    .batch-2 {
      font-size: 6.5px;
      font-weight: 700;
      font-family: Arial, sans-serif;
      line-height: 1.1;
      margin-top: 1px;
      margin-bottom: 3px;
    }

    .right-section {
      position: absolute;
      top: 34px;
      left: 78px;
      width: 220px;
    }

    .qr-holder {
      width: 195px;
      height: 195px;
    }

    .qr-holder img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .address-holder {
      margin-top: 8px;
      font-size: 8.5px;
      line-height: 1.25;
      color: #000000;
    }

    .addr-name {
      font-size: 9px;
      font-weight: 800;
      margin-bottom: 1px;
    }

    .bottom-row {
      position: absolute;
      top: 375px;
      left: 78px;
      width: 220px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .vendor-npq {
      font-size: 9px;
      font-weight: 800;
      margin-left: 20px;
    }

    .flipkart-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
    }

    .fk-text {
      font-size: 7.5px;
      font-weight: 600;
    }

    .fk-order {
      font-size: 8.5px;
      font-weight: 800;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="form-panel">
      <h2>Ekart Label Config</h2>

      <div class="field">
        <label>Tracking ID (TID) *</label>
        <input type="text" id="inTid" value="FMPP4251661422" oninput="render()" />
      </div>

      <div class="field">
        <label>Hub Code</label>
        <input type="text" id="inHub" value="CCJ/KOT" oninput="render()" />
      </div>

      <div class="field">
        <label>Order Reference ID</label>
        <input type="text" id="inOrder" value="S99090861540" oninput="render()" />
      </div>

      <div class="field">
        <label>Customer Name</label>
        <input type="text" id="inName" value="Nasrin K" oninput="render()" />
      </div>

      <div class="field">
        <label>Address Line 1</label>
        <input type="text" id="inAddr1" value="Kuruniyan saw mill Othukkungal" oninput="render()" />
      </div>

      <div class="field">
        <label>Landmark</label>
        <input type="text" id="inLandmark" value="after the transformer" oninput="render()" />
      </div>

      <div class="field">
        <label>Locality</label>
        <input type="text" id="inLocality" value="Nottanalakkal, Othukkungal, Near Jamia Ihyaussun" oninput="render()" />
      </div>

      <div class="field">
        <label>District & PIN</label>
        <input type="text" id="inPin" value="Malappuram - 676528" oninput="render()" />
      </div>

      <div class="field">
        <label>State</label>
        <input type="text" id="inState" value="Kerala" oninput="render()" />
      </div>

      <div class="btn-group">
        <button class="btn-zip" onclick="downloadZipArchive()">
          📦 Download shipments_[TID].zip
        </button>
        <button class="btn-prn" onclick="downloadSinglePrn()">
          📄 Download shipmentId_[TID].prn
        </button>
      </div>
    </div>

    <!-- Live Preview Stage -->
    <div class="preview-stage">
      <div class="label-canvas">
        <div class="top-header">
          <span class="brand-text">NDD E-Kart Logistics</span>
          <div class="status-tags">
            <span class="status-prepaid">PREPAID</span>
            <span class="status-priority">PRIORITY</span>
          </div>
        </div>

        <div class="left-barcode-container">
          <div class="rotator">
            <svg id="svgMainBarcode"></svg>
            <div class="rot-labels-col">
              <span id="dispHub">CCJ/KOT</span>
              <span id="dispTid">FMPP4251661422</span>
            </div>
          </div>
        </div>

        <div class="lower-left-section">
          <div class="batch-1">13-09</div>
          <div class="batch-2">LIAADSJ270015039</div>
          <svg id="svgMiniBarcode"></svg>
        </div>

        <div class="right-section">
          <div class="qr-holder">
            <img id="qrImg" src="" alt="QR" />
          </div>

          <div class="address-holder">
            <div class="addr-name" id="dispName">Nasrin K</div>
            <div id="dispAddr1">Kuruniyan saw mill Othukkungal</div>
            <div id="dispLandmark">after the transformer</div>
            <div id="dispLocality">Nottanalakkal, Othukkungal, Near Jamia Ihyaussun</div>
            <div id="dispPin">Malappuram - 676528</div>
            <div id="dispState">Kerala</div>
          </div>
        </div>

        <div class="bottom-row">
          <span class="vendor-npq">NPQ</span>
          <div class="flipkart-col">
            <span class="fk-text">Ordered Through Flipkart</span>
            <span class="fk-order" id="dispOrder">S99090861540</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function render() {
      const tid = document.getElementById('inTid').value.trim() || 'FMPP4251661422';
      const hub = document.getElementById('inHub').value.trim() || 'CCJ/KOT';
      const order = document.getElementById('inOrder').value.trim() || 'S99090861540';
      const name = document.getElementById('inName').value;
      const addr1 = document.getElementById('inAddr1').value;
      const landmark = document.getElementById('inLandmark').value;
      const locality = document.getElementById('inLocality').value;
      const pin = document.getElementById('inPin').value;
      const state = document.getElementById('inState').value;

      document.getElementById('dispHub').textContent = hub;
      document.getElementById('dispTid').textContent = tid;
      document.getElementById('dispName').textContent = name;
      document.getElementById('dispAddr1').textContent = addr1;
      document.getElementById('dispLandmark').textContent = landmark;
      document.getElementById('dispLocality').textContent = locality;
      document.getElementById('dispPin').textContent = pin;
      document.getElementById('dispState').textContent = state;
      document.getElementById('dispOrder').textContent = order;

      try {
        JsBarcode("#svgMainBarcode", tid, {
          format: "CODE128",
          width: 1.5,
          height: 44,
          displayValue: false,
          margin: 0,
          background: "transparent",
          lineColor: "#000000"
        });
      } catch (e) {}

      try {
        JsBarcode("#svgMiniBarcode", "1309", {
          format: "CODE128",
          width: 0.95,
          height: 22,
          displayValue: false,
          margin: 0,
          background: "transparent",
          lineColor: "#000000"
        });
      } catch (e) {}

      const pinOnly = (pin.match(/\d{6}/) || [pin])[0];
      const qrData = `${tid};${order};${pinOnly}`;
      document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(qrData)}`;
    }

    function buildRotatedZpl() {
      const tid = document.getElementById('inTid').value.trim();
      const hub = document.getElementById('inHub').value.trim() || 'CCJ/KOT';
      const order = document.getElementById('inOrder').value.trim() || 'S99090861540';
      const name = document.getElementById('inName').value;
      const addr1 = document.getElementById('inAddr1').value;
      const landmark = document.getElementById('inLandmark').value;
      const locality = document.getElementById('inLocality').value;
      const pin = document.getElementById('inPin').value;
      const state = document.getElementById('inState').value;
      const pinOnly = (pin.match(/\d{6}/) || [pin])[0];

      return `^XA
~TA000
~JSN
^LT0
^MNW
^MTD
^PON
^PMN
^LH0,0
^JMA
^PR5,5
~SD30
^JUS
^LRN
^CI27
^PA0,1,1,0
^XZ
^XA
^MMT
^PW672
^LL468
^LS0

^FX TOP HEADER ^FS
^FO641,16^A0R,20,20^FDNDD E-Kart Logistics^FS
^FO640,250^A0R,18,18^FDPREPAID^FS
^FO635,340^GB26,90,26^FS
^FO640,348^FR^A0R,17,17^FDPRIORITY^FS
^FO223,17^BY2,2,76.2188940092166^BCN,76.2188940092166,N,N,N^FD${tid}^FS
^FO571,130^A0I,14,17^FD${hub}^FS
^FO358,131^A0I,17,17^FD${tid}^FS
^FO129,11^A0R,20,20^FD13-09^FS
^FO107,11^A0R,12,12^FDLIAADSJ270015039^FS
^FO54,9^BY1,2,33.47926267281106^BCR,33.47926267281106,N,N,N^FD1309^FS
^FO348,175^BQN,2,9^FDLA,${tid};${order};${pinOnly}^FS
^FO325,170^A0R,19,19^FD${name}^FS
^FO294,169^A0R,14,14^FD${addr1}^FS
^FO274,169^A0R,13,13^FD${landmark}^FS
^FO254,169^A0R,13,13^FD${locality}^FS
^FO231,169^A0R,16,16^FD${pin}^FS
^FO205,168^A0R,17,14^FD${state}^FS
^FO34,227^A0R,20,20^FDNPQ^FS
^FO93,323^A0R,14,14^FDOrdered Through Flipkart^FS
^FO65,343^A0R,18,18^FD${order}^FS
^XZ
`;
    }

    async function downloadZipArchive() {
      const tid = document.getElementById('inTid').value.trim();
      if (!tid) {
        alert("Please enter a Tracking ID.");
        return;
      }

      try {
        const zip = new JSZip();
        const prnData = buildRotatedZpl();
        zip.file(`shipmentId_${tid}.prn`, prnData);

        const blob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `shipments_${tid}.zip`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      } catch (err) {
        alert("Failed to generate ZIP: " + err.message);
      }
    }

    function downloadSinglePrn() {
      const tid = document.getElementById('inTid').value.trim();
      if (!tid) {
        alert("Please enter a Tracking ID.");
        return;
      }

      const prnData = buildRotatedZpl();
      const blob = new Blob([prnData], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `shipmentId_${tid}.prn`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    render();
  </script>
</body>
</html>
